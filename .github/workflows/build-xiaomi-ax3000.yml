name: Build OpenWrt for Xiaomi AX3000

on:
  workflow_dispatch:
  push:
    branches:
      - 'ipq50xx-xiaomi-ax3000-25.12'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite feeds to github.com
        run: |
          sed -i \
            -e 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' \
            -e 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' \
            -e 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|g' \
            -e 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|g' \
            -e 's|https://git.openwrt.org/feed/video.git|https://github.com/openwrt/video.git|g' \
            feeds.conf.default

      - name: Hook the openwrt_core URL for opkg
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          TIME="$(curl "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          echo "ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}" >version
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace wpad-basic-wolfssl with wpad-wolfssl in Xiaomi AX3000 Device Packages
        run: |
          MK_FILE="./target/linux/qualcommax/image/ipq50xx.mk"
          sed -i 's/wpad-basic-wolfssl/wpad-wolfssl/g' "$MK_FILE"
          grep "wpad-wolfssl" "$MK_FILE"

      - name: Configure
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_qualcommax=y
            CONFIG_TARGET_qualcommax_ipq50xx=y
            CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000=y
            CONFIG_ALL_KMODS=y
            CONFIG_ALL_NONSHARED=y
            CONFIG_BUILD_PATENTED=y
            CONFIG_IB=y
            CONFIG_MAKE_TOOLCHAIN=y
            CONFIG_PACKAGE_attendedsysupgrade-common=y
            CONFIG_PACKAGE_batctl-default=y
            CONFIG_PACKAGE_cgi-io=y
            CONFIG_PACKAGE_coreutils=y
            CONFIG_PACKAGE_coreutils-sort=y
            CONFIG_PACKAGE_kmod-batman-adv=y
            CONFIG_PACKAGE_libiwinfo=y
            CONFIG_PACKAGE_libiwinfo-data=y
            CONFIG_PACKAGE_liblua=y
            CONFIG_PACKAGE_liblucihttp=y
            CONFIG_PACKAGE_liblucihttp-ucode=y
            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
            CONFIG_PACKAGE_luci-app-firewall=y
            CONFIG_PACKAGE_luci-app-package-manager=y
            CONFIG_PACKAGE_luci-base=y
            CONFIG_PACKAGE_luci-lib-ip=y
            CONFIG_PACKAGE_luci-lib-nixio=y
            CONFIG_PACKAGE_luci-lib-uqr=y
            CONFIG_PACKAGE_luci-light=y
            CONFIG_PACKAGE_luci-mod-admin-full=y
            CONFIG_PACKAGE_luci-mod-network=y
            CONFIG_PACKAGE_luci-mod-status=y
            CONFIG_PACKAGE_luci-mod-system=y
            CONFIG_PACKAGE_luci-proto-batman-adv=y
            CONFIG_PACKAGE_luci-proto-ipv6=y
            CONFIG_PACKAGE_luci-proto-ppp=y
            CONFIG_PACKAGE_luci-theme-bootstrap=y
            CONFIG_PACKAGE_rpcd=y
            CONFIG_PACKAGE_rpcd-mod-file=y
            CONFIG_PACKAGE_rpcd-mod-iwinfo=y
            CONFIG_PACKAGE_rpcd-mod-luci=y
            CONFIG_PACKAGE_rpcd-mod-rpcsys=y
            CONFIG_PACKAGE_rpcd-mod-rrdns=y
            CONFIG_PACKAGE_rpcd-mod-ucode=y
            CONFIG_PACKAGE_ucode-mod-html=y
            CONFIG_PACKAGE_ucode-mod-log=y
            CONFIG_PACKAGE_ucode-mod-math=y
            CONFIG_PACKAGE_uhttpd=y
            CONFIG_PACKAGE_uhttpd-mod-ubus=y
            # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
            # CONFIG_PACKAGE_wpad-basic-wolfssl is not set
            CONFIG_PACKAGE_wpad-wolfssl=y
            CONFIG_REPRODUCIBLE_DEBUG_INFO=y
            CONFIG_SDK=y
            CONFIG_TARGET_ROOTFS_CPIOGZ=y
            # CONFIG_IB_STANDALONE is not set
          EOF
          make defconfig

      - name: Download
        run: |
          make -j16 download

      - name: Build tools
        run: |
          make -j$(nproc) tools/install

      - name: Build toolchain
        run: |
          make -j$(nproc) toolchain/install

      - name: Build all
        run: |
          make -j$(nproc) V=s IGNORE_ERRORS=1

      - name: Upload bin to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-qualcommax-ipq50xx
          path: bin/targets/qualcommax/ipq50xx/*

      - name: Upload dl to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dl
          path: dl/*

  gh-pages:
    needs: [ build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          path: 'gh-pages'
          ref: 'gh-pages'
          fetch-depth: 0

      - name: Configure the git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Drop old versions
        run: |
          cd gh-pages
          readarray -t old_version < <(git log --format='%h' -- "${GITHUB_REF_NAME}" | tail -n +10)
          GIT_SEQUENCE_EDITOR="sed -i '1 i break'" git rebase --interactive --committer-date-is-author-date --root
          for commit in "${old_version[@]}"; do
            sed -i "/${commit}/d" .git/rebase-merge/git-rebase-todo
          done
          git rebase --continue

      - name: Download bin from artifacts
        uses: actions/download-artifact@v4
        with:
          name: bin-qualcommax-ipq50xx
          path: bin/

      - name: Copy contents
        run: |
          version="$(cat "bin/version.buildinfo")"
          mkdir -p "gh-pages/${GITHUB_REF_NAME}/${version}/"
          cp -avr bin/packages/* "gh-pages/${GITHUB_REF_NAME}/${version}/"

      - name: Commit
        run: |
          cd gh-pages
          git add .
          git commit -m "Add: ${GITHUB_REF_NAME}: $(cat ../bin/version.buildinfo)"

      - name: Publish
        run: |
          cd gh-pages
          git push -f origin gh-pages

  release:
    needs: [ build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dl from artifacts
        uses: actions/download-artifact@v4
        with:
          name: dl
          path: dl/

      - name: Download bin from artifacts
        uses: actions/download-artifact@v4
        with:
          name: bin-qualcommax-ipq50xx
          path: bin/targets/qualcommax/ipq50xx/

      - name: Tar
        run: |
          tar cvf dl.tar -C dl/ .
          tar cvf bin-ipq50xx.tar -C bin/targets/qualcommax/ipq50xx/ .

      - name: Generate release informations
        run: |
          TIME="$(curl "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          TAG="ci-${GITHUB_REF_NAME}-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          echo "TAG=$TAG" >>$GITHUB_ENV

          cat <<EOF | sed -E 's/^  //' >Release.md
            CI ${GITHUB_REF_NAME} $(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')

            # ${GITHUB_REF_NAME}

            Build time: \`$(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')\`
            Release version: ${TAG}

            ## Sources
            $(cat bin/targets/qualcommax/ipq50xx/feeds.buildinfo | awk -F'[ ^]' '{printf "%s: `%s`\n", $2, $4}')

            ## SHA256
            $(cat bin/targets/qualcommax/ipq50xx/sha256sums | awk '{printf "%s: `%s`\n", $2, $1}' | sed -E 's/^\*//')
          EOF

          echo "NAME=$(head --line=1 Release.md)" >>$GITHUB_ENV
          tail --line=+2 Release.md >Body.md

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md
          files: |
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/*.*
            *.tar
